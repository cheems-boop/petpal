name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号单一真源：module/module.prop
      - name: 读版本号
        id: v
        run: |
          VER=$(sed -n 's/^version=v//p' module/module.prop | head -1)
          CODE=$(sed -n 's/^versionCode=//p' module/module.prop | head -1)
          echo "name=$VER" >> $GITHUB_OUTPUT
          # 10000+ 避开历史骨架版本号（v1.5 时曾是 36）；不能写成 "1$CODE"，那是字符串拼接
          echo "code=$((10000 + CODE))" >> $GITHUB_OUTPUT

      # C 核心：零依赖，直接用 NDK 的 clang
      - name: 编译 libpethost.so
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-linux-android28 -O2 -fPIC -shared \
            -Wall -Wextra -Wno-unused-parameter \
            -o libpethost.so src/pethost.c -llog -landroid -lm

      - name: 参数校验（-Wall 零告警是承诺）
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-linux-android28 -fsyntax-only -Wall -Wextra \
            -Werror -Wno-unused-parameter src/pethost.c

      - name: dex
        run: |
          mkdir -p out
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          if [ -f src/android/java/pet/runtime/Main.java ]; then
            echo "从 Java 源码编译"
            mkdir -p out/classes
            javac -source 11 -target 11 -nowarn -d out/classes src/android/java/pet/runtime/*.java
            $BT/d8 --min-api 28 --output out out/classes/pet/runtime/*.class
          else
            # 欠账：Java 源码尚未从 smali 重建，先用预编译字节码（见 docs/DECISIONS.md）
            echo "使用预编译字节码 src/android/dex/classes.dex"
            cp src/android/dex/classes.dex out/classes.dex
          fi
          ls -l out/classes.dex

      - name: aapt2 link + 打包
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/aapt2 link -o out/base.apk \
            -I $ANDROID_HOME/platforms/android-36/android.jar \
            --manifest src/android/AndroidManifest.xml \
            --version-code ${{ steps.v.outputs.code }} \
            --version-name ${{ steps.v.outputs.name }} \
            --min-sdk-version 28 --target-sdk-version 36
          cd out && zip -q base.apk classes.dex && mkdir -p lib/arm64-v8a && \
            cp ../libpethost.so lib/arm64-v8a/ && zip -q -r base.apk lib && cd ..

      - name: 签名
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          # 签名密钥就在仓库里（tools/signing/petpal.jks）—— 刻意公开：零 secrets，
          # tag 一推就能出正式包；代价是别人也能签同名包，README 已声明只从 Releases 下载。
          # 想改回 secrets：把下面两行换成从 ${{ secrets.* }} 取即可。
          $BT/apksigner sign --ks tools/signing/petpal.jks --ks-key-alias petpal \
            --ks-pass pass:petpal --key-pass pass:petpal \
            --out petpal.apk out/base.apk
          $BT/apksigner verify --print-certs petpal.apk | head -5

      - name: 打模块 zip
        run: |
          rm -rf pkg && mkdir -p pkg
          cp module/module.prop module/service.sh module/ctl.sh module/customize.sh pkg/
          cp petpal.apk pkg/petpal.apk
          cp -a module/skins module/webroot pkg/
          cd pkg && zip -qr ../petpal-module.zip . && cd ..
          ls -l petpal.apk petpal-module.zip

      - uses: actions/upload-artifact@v4
        with:
          name: petpal-${{ steps.v.outputs.name }}
          path: |
            petpal.apk
            petpal-module.zip

      - name: 打 tag 时自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            petpal.apk
            petpal-module.zip
